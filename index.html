<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rediscombobulator Master - Fixed Final</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2c3e55;--accent:#e2400a;--blue-ui:#1eb1da;--text:#fff;--card:rgba(0,0,0,.2);--star:#f1c40f;--scroll-track:rgba(0,0,0,.1);--scroll-thumb:var(--blue-ui)}
body.light{--bg:#f5f7fa;--blue-ui:#2980b9;--text:#2c3e50;--card:rgba(0,0,0,.05);--scroll-track:rgba(0,0,0,.05);--scroll-thumb:#bdc3c7}body.slate{--bg:#1a202c;--blue-ui:#4fd1c5;--text:#e2e8f0;--card:rgba(255,255,255,.05);--scroll-track:rgba(255,255,255,.05);--scroll-thumb:#4a5568}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;display:flex;height:100vh;margin:0;transition:all .3s ease;overflow:hidden;scrollbar-color:var(--scroll-thumb) var(--scroll-track)}#db-list::-webkit-scrollbar{width:6px}#db-list::-webkit-scrollbar-track{background:var(--scroll-track)}#db-list::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:10px}
#sidebar{width:280px;background:var(--card);border-right:1px solid rgba(128,128,128,.2);display:flex;flex-direction:column;padding:20px;transition:transform .3s ease,margin-left .3s ease;z-index:10}body.focus-mode #sidebar{margin-left:-280px;transform:translateX(-100%)}.search-box{margin-bottom:15px}#searchInput{width:100%;padding:12px;border-radius:8px;border:1px solid var(--blue-ui);background:rgba(0,0,0,.2);color:var(--text);box-sizing:border-box;font-family:inherit;font-size:16px}.filter-row{display:flex;gap:5px;margin-bottom:15px}.filter-btn{flex:1;font-size:.7rem;padding:8px;background:transparent;border:1px solid var(--blue-ui);color:var(--blue-ui);cursor:pointer;border-radius:5px;text-transform:uppercase}.filter-btn.active{background:var(--blue-ui);color:#fff}.filter-btn.favorites-btn{flex:0 0 auto;color:var(--star);border-color:var(--star);font-size:1rem;line-height:1;padding:6px 10px}.filter-btn.favorites-btn.active{background:var(--star);color:#2c3e55}
#db-list{overflow-y:auto;flex:1;scroll-behavior:smooth}.db-item{padding:12px;font-size:.9rem;cursor:pointer;border-radius:8px;margin-bottom:5px;color:var(--blue-ui);border:1px solid transparent;display:flex;justify-content:space-between;align-items:center}.db-item:hover{background:rgba(128,128,128,.1)}.db-item.active{background:var(--blue-ui);color:#fff}
#main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:20px;text-align:center}#entry-wrapper{width:100%;max-width:850px;cursor:pointer}#cz{font-size:2.2rem;font-weight:500;margin-bottom:30px;line-height:1.2}#en{font-size:1.6rem;font-weight:300;min-height:4rem;color:var(--text)}b,strong{color:var(--accent)!important;font-weight:700}.char{opacity:0;transition:opacity .1s;display:inline}.char.on{opacity:1}#top-tools{position:absolute;top:15px;right:15px;display:flex;gap:8px}#bottom-tools{position:absolute;bottom:30px;display:flex;gap:10px;align-items:center;justify-content:center;width:100%}.btn{background:transparent;border:1px solid var(--blue-ui);color:var(--blue-ui);padding:10px 15px;cursor:pointer;border-radius:8px;font-family:inherit;font-size:.85rem;transition:.2s;white-space:nowrap}.btn:hover{background:var(--blue-ui);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}#star-btn{font-size:2.2rem;color:var(--text);opacity:.2;cursor:pointer;margin-top:20px;background:none;border:none;transition:.2s}#star-btn.active{color:var(--star)!important;opacity:1;transform:scale(1.1)}#drop-zone{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.hidden{display:none!important}.data-menu-wrap{position:relative}#data-menu{position:absolute;top:calc(100% + 7px);right:0;width:180px;padding:6px;background:var(--bg);border:1px solid var(--blue-ui);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.25);z-index:30}#data-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:10px;border-radius:5px;font-family:inherit;cursor:pointer}#data-menu button:hover:not(:disabled){background:var(--blue-ui);color:#fff}#data-menu button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:768px){#cz{font-size:1.7rem}#en{font-size:1.3rem}#sidebar{width:100%;position:absolute;height:100%}body.focus-mode #sidebar{margin-left:-100%}}
</style>
</head>
<body class="dark">
<div id="drop-zone"><p>Vložte soubor s daty pro zahájení</p><input type="file" id="fileInput" accept="application/json,.json" style="margin:20px 0"><br><button id="cancel-upload" class="btn hidden" onclick="cancelUpdate()">ZRUŠIT</button></div>
<div id="sidebar"><div class="search-box"><label for="searchInput" class="hidden">Hledat slovo</label><input type="text" id="searchInput" placeholder="Hledat slovo..." aria-label="Hledat slovo" oninput="handleSearch()"></div><div class="filter-row"><button class="filter-btn" onclick="setFilter(0)">beg</button><button class="filter-btn" onclick="setFilter(1)">fb</button><button class="filter-btn" onclick="setFilter(2)">int</button><button class="filter-btn" onclick="setFilter(3)">adv</button><button class="filter-btn favorites-btn" id="favorites-filter-btn" title="Oblíbené karty" aria-label="Oblíbené karty" onclick="toggleFavoritesFilter()">★</button></div><div id="db-list"></div></div>
<div id="main"><div id="top-tools"><button class="btn" id="reveal-mode-btn" onclick="toggleRevealMode()">Kousky</button><button class="btn" onclick="document.body.classList.toggle('focus-mode')" title="Focus Mode">⛶</button><button class="btn" onclick="toggleTheme()">◐</button><div class="data-menu-wrap"><button class="btn" id="data-btn" type="button" aria-haspopup="true" aria-expanded="false" onclick="toggleDataMenu(event)">Data</button><div id="data-menu" class="hidden" role="menu"><button type="button" role="menuitem" onclick="openDataUpload()">Nahrát JSON</button><button type="button" role="menuitem" onclick="exportToJSON()">Exportovat JSON</button><button type="button" role="menuitem" id="csv-export-btn" onclick="exportToCSV()" disabled>Exportovat CSV</button><button type="button" role="menuitem" onclick="clearFavorites()">Smazat všechny oblíbené</button></div></div></div><div id="entry-wrapper" onclick="handleReveal()"><div id="cz" aria-live="polite">Vyberte kategorii nebo hledejte</div><div id="en" aria-live="polite"></div><button id="star-btn" aria-label="Přidat nebo odebrat z oblíbených" aria-pressed="false" onclick="toggleStar(event)">☆</button></div><div id="bottom-tools"><button class="btn" onclick="prev()">⬅ ZPĚT</button><button class="btn" onclick="toggleSwap()">⇅</button><button class="btn" onclick="next()">DALŠÍ ➡</button></div></div>
<script>
let rawData,currentBank,history=[],currentIndex=-1,isSwapped=false,revealIndex=0;let revealMode=localStorage.getItem('redis_reveal_mode')||'partial';let starred=safeParseObject(localStorage.getItem('redis_stars'),{});let currentLevel=null,drawBag=[],currentSearchMatches=null,favoritesOnly=false;
function safeParseObject(value,fallback){try{const parsed=JSON.parse(value||'');return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:fallback}catch{return fallback}}
function validateData(data){if(!data||!Array.isArray(data.banks))throw new Error('Chybí pole "banks".');data.banks.forEach((bank,bankIndex)=>{if(!bank||typeof bank!=='object')throw new Error(`Banka ${bankIndex+1} není objekt.`);if(!Array.isArray(bank.entries))throw new Error(`Banka ${bankIndex+1} nemá platné pole "entries".`);if(bank.levels!==undefined&&!Array.isArray(bank.levels))throw new Error(`Banka ${bankIndex+1} má neplatné "levels".`);bank.entries.forEach((entry,entryIndex)=>{if(!entry||typeof entry!=='object'||typeof entry.top!=='string'||typeof entry.bottom!=='string')throw new Error(`Položka ${entryIndex+1} v bance ${bankIndex+1} musí mít textové "top" a "bottom".`)})});return data}
function parseAndValidateData(text){return validateData(JSON.parse(text))}function resetPracticeState(){currentBank=undefined;history=[];currentIndex=-1;revealIndex=0;drawBag=[];currentSearchMatches=null;favoritesOnly=false;document.getElementById('cz').textContent='Vyberte kategorii nebo hledejte';document.getElementById('en').innerHTML='';updateStarUI(null);updateFavoritesButton();updateDataMenuState()}
function normalizeCardText(value){return String(value).replace(/<[^>]*>/g,'').toLowerCase()}function getCardId(bank,entry,entryIndex){return`${bank.id||bank.displayName||'bank'}::${entry.id||entryIndex}`}function createHistoryItem(entry,entryIndex){return{...entry,entryIndex,cardId:getCardId(currentBank,entry,entryIndex),revealedCount:0}}function isFavorite(bank,entry,entryIndex){return!!starred[getCardId(bank,entry,entryIndex)]}function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function refillDrawBag(){const source=currentSearchMatches||currentBank.entries.map((entry,index)=>({entry,index}));drawBag=shuffle(source);if(drawBag.length>1&&history.length){const lastIndex=history[history.length-1].entryIndex;const lastPosition=drawBag.findIndex(item=>item.index===lastIndex);if(lastPosition===drawBag.length-1)[drawBag[lastPosition],drawBag[0]]=[drawBag[0],drawBag[lastPosition]]}}
function downloadFile(content,filename,type){const url=URL.createObjectURL(new Blob([content],{type}));const link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),0)}
window.onload=()=>{const theme=localStorage.getItem('redis_theme')||'dark';document.body.classList.remove('light','slate','dark');document.body.classList.add(['light','slate','dark'].includes(theme)?theme:'dark');updateRevealModeBtn();updateFavoritesButton();try{const saved=localStorage.getItem('redis_data');if(!saved)return;rawData=parseAndValidateData(saved);document.getElementById('drop-zone').classList.add('hidden');document.getElementById('cancel-upload').classList.remove('hidden');renderBankList();updateDataMenuState()}catch(error){console.error(error);localStorage.removeItem('redis_data');alert('Uložená data jsou poškozená nebo mají neplatný formát. Nahrajte JSON znovu.')}};
document.getElementById('fileInput').addEventListener('change',event=>{const file=event.target.files[0];if(!file)return;if(rawData&&!confirm('Opravdu nahradit aktuální banky novým souborem?')){event.target.value='';return}const reader=new FileReader();reader.onload=()=>{try{rawData=parseAndValidateData(reader.result);localStorage.setItem('redis_data',reader.result);resetPracticeState();document.getElementById('drop-zone').classList.add('hidden');document.getElementById('cancel-upload').classList.remove('hidden');renderBankList()}catch(error){alert('Neplatný JSON: '+error.message)}finally{event.target.value=''}};reader.onerror=()=>{alert('Soubor se nepodařilo načíst.');event.target.value=''};reader.readAsText(file)});
function toggleDataMenu(event){event.stopPropagation();const menu=document.getElementById('data-menu'),button=document.getElementById('data-btn'),willOpen=menu.classList.contains('hidden');menu.classList.toggle('hidden',!willOpen);button.setAttribute('aria-expanded',String(willOpen));updateDataMenuState()}function closeDataMenu(){document.getElementById('data-menu').classList.add('hidden');document.getElementById('data-btn').setAttribute('aria-expanded','false')}function updateDataMenuState(){document.getElementById('csv-export-btn').disabled=!currentBank}function openDataUpload(){closeDataMenu();document.getElementById('drop-zone').classList.remove('hidden')}function cancelUpdate(){if(rawData)document.getElementById('drop-zone').classList.add('hidden')}function exportToJSON(){if(!rawData)return;closeDataMenu();downloadFile(JSON.stringify(rawData,null,2),'rediscombobulator-zaloha.json','application/json;charset=utf-8')}function exportToCSV(){if(!currentBank)return;closeDataMenu();let csv='\uFEFFCzech;English\n';currentBank.entries.forEach(entry=>{csv+=`"${entry.top.replace(/"/g,'""')}";"${entry.bottom.replace(/"/g,'""')}"\n`});downloadFile(csv,`${currentBank.displayName||'export'}.csv`,'text/csv;charset=utf-8;')}
function clearFavorites(){if(!Object.keys(starred).length){closeDataMenu();return}if(!confirm('Opravdu smazat všechny oblíbené karty?'))return;starred={};localStorage.setItem('redis_stars','{}');closeDataMenu();updateStarUI(null);updateFavoritesButton();renderBankList(currentLevel,document.getElementById('searchInput').value)}
function toggleRevealMode(){revealMode=revealMode==='partial'?'full':'partial';localStorage.setItem('redis_reveal_mode',revealMode);updateRevealModeBtn()}function updateRevealModeBtn(){document.getElementById('reveal-mode-btn').innerText=revealMode==='partial'?'Kousky':'Celek'}function setFilter(level){favoritesOnly=false;updateFavoritesButton();renderBankList(level===currentLevel?null:level,document.getElementById('searchInput').value)}function toggleFavoritesFilter(){favoritesOnly=!favoritesOnly;currentLevel=null;updateFavoritesButton();renderBankList(null,document.getElementById('searchInput').value)}function updateFavoritesButton(){const button=document.getElementById('favorites-filter-btn');if(button){button.classList.toggle('active',favoritesOnly);button.setAttribute('aria-pressed',String(favoritesOnly))}}
function renderBankList(level=null,searchTerm=''){const list=document.getElementById('db-list');list.innerHTML='';currentLevel=level;document.querySelectorAll('.filter-btn:not(.favorites-btn)').forEach((button,index)=>button.classList.toggle('active',index===level));if(!rawData)return;const normalizedSearch=searchTerm.trim().toLowerCase();rawData.banks.forEach(bank=>{const levels=Array.isArray(bank.levels)?bank.levels:[];if(!favoritesOnly&&level!==null&&!levels.includes(level))return;const matchingEntries=bank.entries.map((entry,index)=>({entry,index})).filter(item=>{const matchesSearch=!normalizedSearch||(normalizeCardText(item.entry.top)+normalizeCardText(item.entry.bottom)).includes(normalizedSearch);const matchesFavorite=!favoritesOnly||isFavorite(bank,item.entry,item.index);return matchesSearch&&matchesFavorite});if(!matchingEntries.length)return;const div=document.createElement('div');div.className='db-item'+(currentBank===bank?' active':'');div.tabIndex=0;div.setAttribute('role','button');div.setAttribute('aria-label',`Otevřít banku ${bank.displayName}, ${matchingEntries.length} karet`);const name=document.createElement('span');name.textContent=bank.displayName||'Bez názvu';const count=document.createElement('small');count.textContent=matchingEntries.length;div.append(name,count);const openBank=()=>{currentBank=bank;currentSearchMatches=(normalizedSearch||favoritesOnly||level!==null)?matchingEntries:null;history=[];currentIndex=-1;revealIndex=0;drawBag=[];renderBankList(level,searchTerm);updateDataMenuState();next();if(window.innerWidth<768)document.body.classList.add('focus-mode')};div.onclick=openBank;div.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openBank()}};list.appendChild(div)})}
function handleSearch(){renderBankList(currentLevel,document.getElementById('searchInput').value)}function next(){if(!currentBank)return;if(currentIndex<history.length-1){currentIndex++;showEntry();return}if(!drawBag.length)refillDrawBag();const nextCard=drawBag.pop();if(!nextCard)return;history.push(createHistoryItem(nextCard.entry,nextCard.index));currentIndex++;showEntry()}function prev(){if(currentIndex>0){currentIndex--;showEntry()}}
function showEntry(){if(currentIndex<0||!history[currentIndex])return;const item=history[currentIndex];document.getElementById('cz').innerHTML=isSwapped?item.bottom:item.top;const enBox=document.getElementById('en');enBox.innerHTML='';const temp=document.createElement('div');temp.innerHTML=isSwapped?item.top:item.bottom;Array.from(temp.childNodes).forEach(node=>{if(node.nodeType===Node.TEXT_NODE){for(const char of node.textContent){const span=document.createElement('span');span.textContent=char;span.className='char';enBox.appendChild(span)}}else{const element=document.createElement(node.tagName);for(const char of node.textContent){const span=document.createElement('span');span.textContent=char;span.className='char';element.appendChild(span)}enBox.appendChild(element)}});revealIndex=item.revealedCount||0;const chars=enBox.querySelectorAll('.char');for(let i=0;i<revealIndex&&chars[i];i++)chars[i].classList.add('on');updateStarUI(item.cardId)}function handleReveal(){if(currentIndex<0||!history[currentIndex])return;const chars=document.getElementById('en').querySelectorAll('.char');if(revealIndex<chars.length){revealIndex=revealMode==='full'?chars.length:Math.min(chars.length,revealIndex+10);history[currentIndex].revealedCount=revealIndex;for(let i=0;i<revealIndex;i++)if(chars[i])chars[i].classList.add('on')}else next()}
function toggleStar(event){if(event)event.stopPropagation();if(currentIndex<0||!history[currentIndex])return;const item=history[currentIndex],id=item.cardId;if(starred[id])delete starred[id];else starred[id]={top:item.top,bottom:item.bottom,bank:currentBank.displayName||'',entryIndex:item.entryIndex};localStorage.setItem('redis_stars',JSON.stringify(starred));updateStarUI(id);if(favoritesOnly)renderBankList(currentLevel,document.getElementById('searchInput').value)}function updateStarUI(id){const button=document.getElementById('star-btn'),active=!!id&&!!starred[id];button.innerHTML=active?'★':'☆';button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))}function toggleSwap(){isSwapped=!isSwapped;showEntry()}function toggleTheme(){const themes=['light','slate','dark'];const current=themes.find(theme=>document.body.classList.contains(theme))||'dark';document.body.classList.remove(...themes);const nextTheme=themes[(themes.indexOf(current)+1)%themes.length];document.body.classList.add(nextTheme);localStorage.setItem('redis_theme',nextTheme)}document.addEventListener('click',event=>{if(!event.target.closest('.data-menu-wrap'))closeDataMenu()});window.addEventListener('keydown',event=>{const target=event.target;if(['INPUT','TEXTAREA','SELECT'].includes(target.tagName)||target.isContentEditable)return;if(event.key==='Escape'){closeDataMenu();return}if(!currentBank)return;if(event.key==='ArrowRight'){event.preventDefault();next()}else if(event.key==='ArrowLeft'){event.preventDefault();prev()}else if(event.key==='s'||event.key==='S'){event.preventDefault();toggleStar(event)}else if(event.key===' '){event.preventDefault();handleReveal()}});
</script>
</body>
</html>
